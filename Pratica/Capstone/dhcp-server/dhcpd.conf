default-lease-time 600;
max-lease-time 7200;

authoritative;

default-lease-time 600;
max-lease-time 7200;

option domain-name "empresa.local";

subnet 192.168.10.0 netmask 255.255.255.0 {
    range 192.168.10.100 192.168.10.200;

    option subnet-mask 255.255.255.0;
    option broadcast-address 192.168.10.255;
    option routers 192.168.10.1;

    option domain-name "empresa.local";
    option domain-name-servers 192.168.20.20;
}

subnet 192.168.20.0 netmask 255.255.255.0 {
    range 192.168.20.100 192.168.20.200;

    option subnet-mask 255.255.255.0;
    option broadcast-address 192.168.20.255;
    option routers 192.168.20.1;

    option domain-name "empresa.local";
    option domain-name-servers 192.168.20.20;

    host dhcp-server {
        hardware ethernet 02:02:C0:A8:20:10;
        fixed-address 192.168.20.10;
    }

    host dns-server {
        hardware ethernet 02:02:C0:A8:20:20;
        fixed-address 192.168.20.20;
    }

    host web-server {
        hardware ethernet 02:02:C0:A8:20:30;
        fixed-address 192.168.20.30;
    }
}
